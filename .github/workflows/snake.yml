# Membuat animasi ular yang "memakan" grafik kontribusi, lalu menyimpannya ke branch `output`.
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *" # setiap hari pukul 07:00 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Warna ungu–biru senada dengan portofolio
          outputs: |
            dist/github-snake.svg?color_snake=#7c5cff&color_dots=#ebedf0,#d9d0ff,#b3a1ff,#8c6cff,#6b4bff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a58bff&color_dots=#161b22,#2b2560,#4b3fa0,#6b4bff,#a58bff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
